<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="RepoBuddy AI banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- soft decorative circles -->
  <circle cx="1080" cy="60" r="140" fill="#ffffff" opacity="0.05"/>
  <circle cx="1130" cy="360" r="110" fill="#ffffff" opacity="0.05"/>

  <!-- logo -->
  <rect x="90" y="80" width="130" height="130" rx="28" fill="url(#logo)"/>
  <text x="155" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">RB</text>

  <!-- title -->
  <text x="250" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff">RepoBuddy AI</text>
  <text x="252" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#c7d2fe">Understand any GitHub issue, step by step.</text>

  <!-- five section pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">
    <rect x="90" y="270" width="190" height="52" rx="26" fill="#ffffff" opacity="0.15"/>
    <text x="185" y="304" text-anchor="middle">Explanation</text>

    <rect x="300" y="270" width="140" height="52" rx="26" fill="#ffffff" opacity="0.15"/>
    <text x="370" y="304" text-anchor="middle">Steps</text>

    <rect x="460" y="270" width="190" height="52" rx="26" fill="#ffffff" opacity="0.15"/>
    <text x="555" y="304" text-anchor="middle">Files to inspect</text>

    <rect x="670" y="270" width="140" height="52" rx="26" fill="#ffffff" opacity="0.15"/>
    <text x="740" y="304" text-anchor="middle">Tests</text>

    <rect x="830" y="270" width="170" height="52" rx="26" fill="#ffffff" opacity="0.15"/>
    <text x="915" y="304" text-anchor="middle">Checklist</text>
  </g>

  <text x="90" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#a5b4fc">Llama 3.2 3B (under 8B) via Ollama  |  Python + Flask</text>
</svg>
